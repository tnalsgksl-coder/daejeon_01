<span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: {{accent}}; width: 44px">02</span>

</div>
<div style="display: flex; align-items: center; gap: 20px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; color: {{accent}}; width: 44px">03</span>

</div>
</div>
