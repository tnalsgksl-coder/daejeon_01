<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>하늘은 왜 파란색일까? 인스타툰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one narrow column like a phone feed — swipe carousel on top, 2×2 overview below */
:root{
  --bg:#eaf4ff; --surface:#ffffff; --fg:#13284a; --muted:#4e6688; --accent:#1e6fe0; --line:#cfe0f5;
  --display:'Jua','Malgun Gothic',sans-serif; --body:'Gowun Dodum','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1430;--surface:#141e42;--fg:#e8f0ff;--muted:#9fb3d6;--accent:#6aa8ff;--line:#26335f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1430;--surface:#141e42;--fg:#e8f0ff;--muted:#9fb3d6;--accent:#6aa8ff;--line:#26335f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.lede{margin:6px 0 0;color:var(--muted)}
.lede a{color:var(--accent)}
.post{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(20,60,130,.16)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;outline:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:4/5;scroll-snap-align:start;display:block;object-fit:cover}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.dots{display:flex;gap:7px}
.dots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--line);cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{font:inherit;font-family:var(--display);font-size:18px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;min-width:3.2em;text-align:center}
button:focus-visible,.track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{padding:0;border:0;background:none;cursor:pointer;border-radius:10px;overflow:hidden;display:block}
.grid img{display:block;width:100%;aspect-ratio:4/5}
.note{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
</style>

<main class="wrap">
  <header>
    <h1>하늘은 왜 파란색일까?</h1>
    <p class="lede">인스타툰 4컷이에요. 옆으로 넘겨서 보세요. <a href="https://claude.ai/artifact/8NscmCXjSQXfZBFy5PSK5X" target="_blank" rel="noopener">영상으로 보기</a></p>
  </header>

  <section class="post" aria-label="인스타툰 4컷">
    <div class="track" id="track" tabindex="0">
      <img src="toon/1.png" alt="1컷: 파란 하늘 아래 사람이 '하늘은 왜 파란색일까?' 하고 묻는다">
      <img src="toon/2.png" alt="2컷: 햇빛이 프리즘을 지나 무지개 색으로 나뉘고, 빨간빛은 파장이 길고 파란빛은 짧다">
      <img src="toon/3.png" alt="3컷: 공기 분자가 파란빛을 사방으로 튕겨낸다. 산란 세기는 1/파장⁴, 파랑은 빨강보다 약 5.9배">
      <img src="toon/4.png" alt="4컷: 흩어진 파란빛이 사방에서 눈으로 들어와 '아하! 그래서 하늘이 파랗구나!'">
    </div>
    <div class="bar">
      <div class="dots" id="dots"></div>
      <div class="nav">
        <button type="button" id="prev" aria-label="이전 컷">‹</button>
        <span class="count" id="count">1 / 4</span>
        <button type="button" id="next" aria-label="다음 컷">›</button>
      </div>
    </div>
  </section>

  <section style="display:grid;gap:12px">
    <h2>모아보기</h2>
    <div class="grid" id="grid"></div>
    <p class="note">컷을 누르면 위에서 그 컷으로 넘어가요.</p>
  </section>
</main>

<script>
const track=document.getElementById('track'),imgs=[...track.querySelectorAll('img')],N=imgs.length;
const dots=document.getElementById('dots'),grid=document.getElementById('grid'),count=document.getElementById('count');
const prev=document.getElementById('prev'),next=document.getElementById('next');
let cur=0;
function go(i,smooth=true){i=Math.max(0,Math.min(N-1,i));track.scrollTo({left:i*track.clientWidth,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto'});set(i)}
function set(i){cur=i;count.textContent=(i+1)+' / '+N;prev.disabled=i===0;next.disabled=i===N-1;[...dots.children].forEach((d,k)=>d.setAttribute('aria-current',k===i))}
imgs.forEach((im,i)=>{const d=document.createElement('button');d.type='button';d.setAttribute('aria-label',(i+1)+'컷');d.onclick=()=>go(i);dots.appendChild(d);
  const g=document.createElement('button');g.type='button';g.setAttribute('aria-label',(i+1)+'컷 보기');const t=document.createElement('img');t.src=im.src;t.alt='';t.loading='lazy';g.appendChild(t);
  g.onclick=()=>{go(i);track.scrollIntoView({behavior:'smooth',block:'center'})};grid.appendChild(g)});
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
track.addEventListener('scroll',()=>{const i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));if(i!==cur)set(i)},{passive:true});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}});
addEventListener('resize',()=>go(cur,false));
set(0);
</script>

</body></html>
