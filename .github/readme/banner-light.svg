<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="나의 AI 작업 모음 - Claude와 함께 기획하고, 쓰고, 그리고, 만든 것들">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0F172A" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="g1" cx="0.8" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.97" cy="1" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.02" cy="1" r="0.45">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="360" fill="#FAFAF9"/>
