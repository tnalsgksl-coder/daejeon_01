    <g transform="translate(1050 180)">
      <circle r="22" fill="#D97757"/>
      <circle r="34" fill="none" stroke="#D97757" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="79" cy="-79" r="9" fill="#8B5CF6"/>
      <circle cx="-112" cy="0" r="7" fill="#38BDF8"/>
      <circle cx="44" cy="44" r="6" fill="#0F172A" fill-opacity="0.7"/>
      <circle cx="-115" cy="114" r="8" fill="#10B981"/>
      <circle cx="140" cy="81" r="5" fill="#F59E0B"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="27.5" fill="none" stroke="#0F172A" stroke-opacity="0.08"/>
