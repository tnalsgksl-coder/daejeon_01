  <text x="72" y="190" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#0F172A">나의 AI 작업 모음</text>
  <text x="72" y="242" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#475569">Claude와 함께 기획하고, 쓰고, 그리고, 만든 것들</text>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" text-anchor="middle" fill="#334155">
