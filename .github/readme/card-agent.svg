  <text x="48" y="64" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#F0A285">01 · AGENT</text>
  <text x="48" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#FAFAF9">나의_AI업무</text>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="21" fill="#D6D3D1">
    <text x="48" y="194">비서 · 조사 · 요약 · 영상 직원에게 일을 나눠 맡기는 AI 에이전트</text>
