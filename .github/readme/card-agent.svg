<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="나의_AI업무 - 주제 조사 AI 에이전트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1" cy="1" r="0.4">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>
    <g stroke="#FAFAF9" stroke-opacity="0.25" stroke-width="1.5">
      <line x1="980" y1="140" x2="890" y2="78"/>
      <line x1="980" y1="140" x2="1040" y2="62"/>
      <line x1="980" y1="140" x2="1095" y2="150"/>
      <line x1="980" y1="140" x2="900" y2="210"/>
      <line x1="980" y1="140" x2="1030" y2="230"/>
      <line x1="890" y1="78" x2="1040" y2="62" stroke-dasharray="3 6"/>
      <line x1="1095" y1="150" x2="1030" y2="230" stroke-dasharray="3 6"/>
    </g>
    <circle cx="980" cy="140" r="30" fill="#D97757" fill-opacity="0.18"/>
    <circle cx="980" cy="140" r="17" fill="#D97757"/>
    <g fill="#FAFAF9" fill-opacity="0.88">
