  <circle cx="1140" cy="252" r="20" fill="none" stroke="#FAFAF9" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M1132 252 H1148 M1142 246 L1148 252 L1142 258" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
